<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSA Visualizer Pro</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Add modern font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
</head>

<body>

    <div class="app-container">

        <!-- SIDEBAR NAVIGATION -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-icon">⚡</div>
                <h2>DSA Visualizer</h2>
            </div>
            <nav class="nav-menu">
                <button class="nav-item active" onclick="changeMode('sorting', this)">
                    <span class="icon">📊</span> Sorting
                </button>
                <button class="nav-item" onclick="changeMode('stack', this)">
                    <span class="icon">📚</span> Stack
                </button>
                <button class="nav-item" onclick="changeMode('queue', this)">
                    <span class="icon">🚶</span> Queue
                </button>
                <button class="nav-item" onclick="changeMode('linkedlist', this)">
                    <span class="icon">🔗</span> Linked List
                </button>
                <button class="nav-item" onclick="changeMode('tree', this)">
                    <span class="icon">🌳</span> Binary Tree
                </button>
                <button class="nav-item" onclick="changeMode('graph', this)">
                    <span class="icon">🕸️</span> Graph
                </button>
                <button class="nav-item" onclick="changeMode('matrix', this)">
                    <span class="icon">🔢</span> Matrix
                </button>
            </nav>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="main-content">
            
            <!-- EDITOR AND CONTROLS PANEL -->
            <section class="control-panel">
                <div class="panel-card">
                    
                    <!-- SORTING SECTION -->
                    <div id="sortingSection" class="control-group">
                        <div class="config-header">
                            <div class="select-wrapper">
                                <label for="algorithm">Load Template</label>
                                <select id="algorithm" onchange="loadTemplate(this.value)">
                                    <option value="" disabled selected>Choose Algorithm...</option>
                                    <option value="bubble_sort">Bubble Sort</option>
                                    <option value="insertion_sort">Insertion Sort</option>
                                    <option value="selection_sort">Selection Sort</option>
                                    <option value="merge_sort">Merge Sort</option>
                                    <option value="quick_sort">Quick Sort</option>
                                    <option value="heap_sort">Heap Sort</option>
                                </select>
                            </div>
                        </div>

                        <div class="editor-container">
                            <div class="editor-title">Python Implementation</div>
                            <div id="editor" class="monaco-instance"></div>
                        </div>

                        <div class="action-footer">
                            <div class="input-field">
                                <input id="arrayInput" value="5,3,8,1" placeholder="Enter comma-separated values">
                            </div>
                            <div class="actions-row">
                                <button class="btn-primary" onclick="runCode()">
                                    <span class="btn-icon">🚀</span> Run
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- STACK SECTION -->
                    <div id="stackControls" class="control-group" style="display:none;">
                        <h3>Stack Operations</h3>
                        <div class="action-footer compact">
                            <input id="stackValue" placeholder="Value to push" class="input-sm">
                            <button class="btn-action" onclick="pushStack()">Push</button>
                            <button class="btn-action danger" onclick="popStack()">Pop</button>
                        </div>
                    </div>

                    <!-- QUEUE SECTION -->
                    <div id="queueControls" class="control-group" style="display:none;">
                        <h3>Queue Operations</h3>
                        <div class="action-footer compact">
                            <input id="queueValue" placeholder="Value to enqueue" class="input-sm">
                            <button class="btn-action" onclick="enqueue()">Enqueue</button>
                            <button class="btn-action danger" onclick="dequeue()">Dequeue</button>
                        </div>
                    </div>

                    <!-- LINKED LIST SECTION -->
                    <div id="linkedListControls" class="control-group" style="display:none;">
                        <h3>Linked List Operations</h3>
                        <div class="action-footer compact">
                            <input id="llValue" placeholder="Value" class="input-sm">
                            <button class="btn-action" onclick="insertNode()">Insert End</button>
                            <button class="btn-action danger" onclick="deleteNode()">Delete Value</button>
                        </div>
                        <div class="traversal-group" style="margin-top: 1rem;">
                            <div class="button-grid">
                                <button class="btn-outline" onclick="searchLL()">Search Value</button>
                                <button class="btn-outline" onclick="traverseLL()">Traverse</button>
                            </div>
                            <div class="traversal-output">
                                <span class="label">Status:</span> <span id="llTraversalOutput" class="result">-</span>
                            </div>
                        </div>
                    </div>

                    <!-- BST SECTION -->
                    <div id="treeControls" class="control-group" style="display:none;">
                        <h3>Binary Search Tree Operations</h3>
                        <div class="action-footer compact">
                            <input id="treeValue" placeholder="Value" class="input-sm">
                            <button class="btn-action" onclick="insertTree()">Insert</button>
                            <button class="btn-action danger" onclick="deleteTreeNode()">Delete</button>
                        </div>
                        <div id="treeTraversalControls" class="traversal-group" style="margin-top: 1rem;">
                            <div class="button-grid">
                                <button class="btn-outline" onclick="runTraversal('inorder')">Inorder</button>
                                <button class="btn-outline" onclick="runTraversal('preorder')">Preorder</button>
                                <button class="btn-outline" onclick="runTraversal('postorder')">Postorder</button>
                                <button class="btn-outline" onclick="runTraversal('levelorder')">Level Order</button>
                            </div>
                            <div class="traversal-output">
                                <span class="label">Output:</span> <span id="traversalOutput" class="result">-</span>
                            </div>
                        </div>
                    </div>

                    <!-- GRAPH SECTION -->
                    <div id="graphControls" class="control-group" style="display:none;">
                        <h3>Graph Operations</h3>
                        <div class="sub-section">
                            <div class="action-footer compact">
                                <input id="nodeValue" placeholder="Node name" class="input-sm">
                                <button class="btn-action" onclick="addNode()">Add Node</button>
                            </div>
                        </div>
                        <div class="sub-section">
                            <div class="action-footer compact">
                                <input id="edgeFrom" placeholder="From" class="input-sm">
                                <input id="edgeTo" placeholder="To" class="input-sm">
                                <button class="btn-action" onclick="addEdge()">Connect</button>
                            </div>
                        </div>
                        <div class="traversal-group">
                            <div class="button-grid">
                                <button class="btn-outline" onclick="runGraphTraversal('bfs')">BFS</button>
                                <button class="btn-outline" onclick="runGraphTraversal('dfs')">DFS</button>
                            </div>
                            <div class="traversal-output">
                                <span class="label">Output:</span> <span id="graphTraversalOutput" class="result">-</span>
                            </div>
                        </div>
                    </div>

                    <!-- MATRIX SECTION -->
                    <div id="matrixControls" class="control-group" style="display:none;">
                        <h3>Matrix Operations</h3>
                        <div class="sub-section">
                            <div class="action-footer compact">
                                <label style="font-size: 0.85rem; color: var(--text-secondary);">Size:</label>
                                <select id="matrixSize" class="input-sm" style="width: 80px; background: var(--bg-primary); border: 1px solid var(--border-color); color: var(--text-primary); border-radius: 4px;" onchange="initMatrix()">
                                    <option value="2">2 x 2</option>
                                    <option value="3" selected>3 x 3</option>
                                    <option value="4">4 x 4</option>
                                </select>
                                <button class="btn-action" onclick="randomizeMatrix()">Random</button>
                            </div>
                        </div>
                        <div class="sub-section" style="margin-top: 10px;">
                            <div class="action-footer compact" style="gap: 6px;">
                                <input id="matrixInput" placeholder="Values (e.g. 1,2,3,4,5,6,7,8,9)" class="input-sm" style="flex: 1;">
                                <button class="btn-action" onclick="loadUserMatrix()" style="white-space: nowrap;">Set Values</button>
                            </div>
                        </div>
                        <div class="traversal-group" style="margin-top: 1rem;">
                            <div class="button-grid" style="grid-template-columns: 1fr 1fr; gap: 8px;">
                                <button class="btn-outline" onclick="animateTranspose()">Transpose</button>
                                <button class="btn-outline" onclick="animateRotate90()">Rotate 90°</button>
                                <button class="btn-outline" onclick="animateMirror()">Mirror (Horiz)</button>
                                <button class="btn-outline" onclick="animateInvert()">Invert Values</button>
                            </div>
                            <div class="traversal-output" style="margin-top: 10px;">
                                <span class="label">Status:</span> <span id="matrixOutput" class="result">-</span>
                            </div>
                        </div>
                    </div>

                </div>
            </section>

            <!-- VISUALIZATION PANEL -->
            <section class="visual-panel">
                <div class="panel-header">
                    <h3>Live Visualization</h3>
                    <!-- Global Playback Controls -->
                    <div id="globalPlaybackControls" class="global-playback" style="display:none;">
                        <button class="btn-ctrl" title="Step Back" onclick="window.engine.stepBackward()">⏮</button>
                        <button class="btn-ctrl accent" id="globalPlayPauseBtn" title="Play / Pause" onclick="window.engine.toggle()">▶</button>
                        <button class="btn-ctrl" title="Step Forward" onclick="window.engine.stepForward()">⏭</button>
                        <span id="stepCounter" class="step-counter">- / -</span>
                        <div class="progress-track">
                            <div id="progressFill" class="progress-fill"></div>
                        </div>
                        <div class="speed-control">
                            <label for="globalSpeed">Speed</label>
                            <input type="range" id="globalSpeed" min="50" max="1000" step="50" value="300">
                        </div>
                    </div>
                </div>
                <div class="visualizer-container">
                    <div id="variableWatch" class="variable-watch-panel"></div>
                    <div id="bars" class="stage"></div>
                </div>
                <!-- Console Output Panel -->
                <div id="consolePanel" class="console-panel" style="display:none;">
                    <div class="console-header">
                        <span class="console-title">⌨ Console Output</span>
                        <div class="console-actions">
                            <button class="console-btn" onclick="clearConsole()" title="Clear">🗑</button>
                            <button class="console-btn" onclick="toggleConsole()" title="Toggle">▼</button>
                        </div>
                    </div>
                    <pre id="consoleOutput" class="console-body"></pre>
                </div>
            </section>

        </main>

    </div>

    <!-- SCRIPTS -->
    <script src="./node_modules/monaco-editor/min/vs/loader.js"></script>
    <script src="engine.js" defer></script>
    <script src="app.js" defer></script>
    <script src="visualizers/sorting.js" defer></script>
    <script src="visualizers/stack.js" defer></script>
    <script src="visualizers/queue.js" defer></script>
    <script src="visualizers/linkedlist.js" defer></script>
    <script src="visualizers/tree.js" defer></script>
    <script src="visualizers/graph.js" defer></script>
    <script src="visualizers/matrix.js" defer></script>

</body>
</html>
